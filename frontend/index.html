<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Intelligent Fake News Detection</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
    <div class="container">
        <h1>Intelligent Fake News Detection</h1>
        <p class="description">Paste a news article below and let the model tell you if it looks REAL or FAKE.</p>
        <textarea id="newsInput" placeholder="Paste news article text here..." rows="10"></textarea>
        <div class="buttons">
            <button id="analyzeBtn">Analyze News</button>
            <button id="clearBtn" class="clear">Clear</button>
        </div>
        <div id="shortWarning" class="warning hidden"></div>
        <div id="loading" class="hidden">🔄 Analyzing… Please wait.</div>
        <div id="result" class="hidden">
            <h2>Result: <span id="predictionLabel"></span></h2>
            <p>Confidence: <span id="confidenceValue"></span>%</p>
        </div>
        <div id="errorMsg" class="error hidden"></div>
        <p class="disclaimer">⚠️ Disclaimer: This prediction is generated by a machine‑learning model and does **not** constitute independent fact‑checking.</p>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
